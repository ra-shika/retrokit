<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Sale Available</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            overflow: hidden; /* Prevent scrolling when the pop-up is displayed */
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .popup {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }
        .popup img {
            max-width: 100%;
            border-radius: 10px;
        }
        .popup h2 {
            font-size: 24px;
            margin: 15px 0;
            color: #444;
        }
        .popup p {
            font-size: 18px;
            color: #666;
        }
        .popup button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .popup button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="overlay" id="popup">
        <div class="popup">
            
            <h2>Sorry!</h2>
            <p>There is no sale at this moment. Please check back later!</p>
            <button onclick="redirectToHome()">Close</button>
        </div>
    </div>

    <script>
        function redirectToHome() {
            window.location.href = "project.html"; // Change "project.html" to your home page URL
        }
    </script>
</body>
</html>
